<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web 對講機 - v8.0 全天候常駐版</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0d10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .ver {
      font-size: 13px;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.12);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .badges {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 12px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      background: #1c2026;
      color: #78909c;
      border: 1px solid #2c323b;
    }
    .badge.ok {
      color: #00e676;
      border-color: rgba(0, 230, 118, 0.4);
      background: rgba(0, 230, 118, 0.08);
    }
    .badge.warn {
      color: #ffab00;
      border-color: rgba(255, 171, 0, 0.4);
      background: rgba(255, 171, 0, 0.08);
    }
    .status {
      margin-bottom: 24px;
      font-size: 16px;
      color: #cfd8dc;
      padding: 0 20px;
      text-align: center;
      line-height: 1.5;
    }
    .debug {
      margin-top: 28px;
      font-size: 13px;
      color: #00e676;
      font-family: monospace;
      background: #15181e;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #262b33;
    }
    #initBtn {
      padding: 16px 34px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      background: #2979ff;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(41, 121, 255, 0.35);
    }
    #pttBtn {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.15);
      background: #ff1744;
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 12px 30px rgba(255, 23, 68, 0.45);
      display: none;
      touch-action: none;
      transition: transform 0.08s ease, background 0.1s ease;
    }
    #pttBtn.active {
      background: #d50000;
      transform: scale(0.95);
      box-shadow: 0 4px 15px rgba(255, 23, 68, 0.7);
    }
    #pttBtn.receiving {
      background: #00c853;
      box-shadow: 0 12px 30px rgba(0, 200, 83, 0.45);
    }
    #pttBtn.offline {
      background: #546e7a;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="ver">v8.0 全天候常駐版 (防休眠 + 自動重連 + 音訊保活)</div>
  
  <div class="badges">
    <div class="badge" id="wakeBadge">螢幕常亮: 未啟動</div>
    <div class="badge" id="netBadge">網絡: 待命</div>
    <div class="badge" id="audioBadge">音訊引擎: 待命</div>
  </div>

  <div class="status" id="statusText">請點擊下方按鈕啟動音訊與常駐保護</div>
  <button id="initBtn">1. 啟用全天候對講機</button>
  <button id="pttBtn">按住通話 (PTT)</button>
  <div class="debug" id="debugText">本機 ID: ---- | TX: 0 | RX: 0</div>

  <script>
    const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
    const ROOM_TOPIC = "ray_walkie_hk/room_v7";
    const TARGET_RATE = 16000;

    // 產生本機專屬 32-bit 隨機 ID，防止聽到自己發出的回音
    const MY_ID = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
    const MY_ID_HEX = MY_ID.toString(16).toUpperCase().padStart(8, '0').slice(0, 4);

    let client = null;
    let audioCtx = null;
    let micStream = null;
    let scriptNode = null;
    let silencer = null;
    let wakeLock = null;
    let keepAliveTimer = null;
    let isTalking = false;
    let nextStartTime = 0;
    let lastSample = 0;
    let txCount = 0;
    let rxCount = 0;
    let rxTimeout = null;

    const initBtn = document.getElementById('initBtn');
    const pttBtn = document.getElementById('pttBtn');
    const statusText = document.getElementById('statusText');
    const debugText = document.getElementById('debugText');
    const wakeBadge = document.getElementById('wakeBadge');
    const netBadge = document.getElementById('netBadge');
    const audioBadge = document.getElementById('audioBadge');

    // 建立 G.711 u-law 解碼查找表 (8-bit -> Float32)
    const ULAW_DECODE = new Float32Array(256);
    (function initUlawTable() {
      for (let i = 0; i < 256; i++) {
        let u = ~i & 0xFF;
        let sign = (u & 0x80) ? -1 : 1;
        let exp = (u >> 4) & 0x07;
        let mant = u & 0x0F;
        let sample = (((mant << 3) + 0x84) << exp) - 0x84;
        ULAW_DECODE[i] = (sign * sample) / 32768.0;
      }
    })();

    function linearToUlaw(sample) {
      const BIAS = 0x84;
      const CLIP = 32635;
      let sign = (sample < 0) ? 0x80 : 0;
      if (sample < 0) sample = -sample;
      if (sample > CLIP) sample = CLIP;
      sample += BIAS;

      let exp = 7;
      for (let expMask = 0x4000; (sample & expMask) == 0 && exp > 0; exp--, expMask >>= 1) {}
      let mant = (sample >> (exp + 3)) & 0x0F;
      return (~(sign | (exp << 4) | mant)) & 0xFF;
    }

    function updateDebug() {
      debugText.innerText = `ID: ${MY_ID_HEX} | 發送(TX): ${txCount} | 接收(RX): ${rxCount}`;
    }
    updateDebug();

    // ================= [修復 A] 螢幕常亮鎖定 (Screen Wake Lock API) =================
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeBadge.innerText = "螢幕常亮: 已鎖定";
          wakeBadge.className = "badge ok";
          wakeLock.addEventListener('release', () => {
            wakeBadge.innerText = "螢幕常亮: 已釋放";
            wakeBadge.className = "badge warn";
          });
        } catch (err) {
          wakeBadge.innerText = "螢幕常亮: 需手動設永不鎖屏";
          wakeBadge.className = "badge warn";
        }
      } else {
        wakeBadge.innerText = "螢幕常亮: 瀏覽器不支援";
        wakeBadge.className = "badge warn";
      }
    }

    // 當切出畫面再返回，或解鎖螢幕時，自動恢復常亮鎖與音訊引擎
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        if (audioCtx) {
          await requestWakeLock();
          await ensureAudioActive();
        }
      }
    });

    // ================= [修復 C] 音訊引擎防掛起與每 20 秒無聲保活脈衝 =================
    async function ensureAudioActive() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
        try {
          await audioCtx.resume();
        } catch (e) {}
      }
      if (audioCtx.state === 'running') {
        audioBadge.innerText = "音訊引擎: 常駐活躍";
        audioBadge.className = "badge ok";
      } else {
        audioBadge.innerText = "音訊引擎: 點擊畫面喚醒";
        audioBadge.className = "badge warn";
      }
    }

    function startAudioKeepAlive() {
      if (keepAliveTimer) clearInterval(keepAliveTimer);
      // 每 20 秒播放 1 個極微弱無聲樣本，防止 iOS 長時間無聲將 AudioContext 休眠
      keepAliveTimer = setInterval(() => {
        if (!audioCtx) return;
        ensureAudioActive();
        if (audioCtx.state === 'running' && !isTalking) {
          const silentBuf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
          const src = audioCtx.createBufferSource();
          src.buffer = silentBuf;
          src.connect(audioCtx.destination);
          src.start();
        }
      }, 20000);
    }

    // 畫面任何觸碰都順便喚醒可能被 iOS 暫停的音訊
    document.body.addEventListener('touchstart', () => {
      if (audioCtx) ensureAudioActive();
    }, { passive: true });

    initBtn.onclick = async () => {
      initBtn.disabled = true;
      statusText.innerText = "正在啟動硬件降噪麥克風與常駐保護...";

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.onstatechange = () => ensureAudioActive();
        await ensureAudioActive();
        startAudioKeepAlive();
        await requestWakeLock();

        statusText.innerText = `音訊就緒 (${audioCtx.sampleRate}Hz)，正在連線伺服器...`;

        // ================= [修復 B] MQTT 長連線保活與斷線極速自動重連 =================
        client = mqtt.connect(MQTT_BROKER, {
          clientId: "Phone_" + MY_ID_HEX + "_" + Math.random().toString(16).slice(2, 6),
          clean: true,
          keepalive: 25,          // 每 25 秒發送心跳包防止 Router 切斷連線
          reconnectPeriod: 2000,  // 一旦斷線，每 2 秒自動重連
          connectTimeout: 10000
        });

        client.on('connect', () => {
          netBadge.innerText = "網絡: 在線";
          netBadge.className = "badge ok";
          pttBtn.classList.remove('offline');
          statusText.innerText = "已連線！支援多機群組廣播，隨時按住紅掣通話";
          initBtn.style.display = 'none';
          pttBtn.style.display = 'block';
          client.subscribe(ROOM_TOPIC, { qos: 0 });
        });

        client.on('reconnect', () => {
          netBadge.innerText = "網絡: 重連中...";
          netBadge.className = "badge warn";
          pttBtn.classList.add('offline');
          statusText.innerText = "網絡閃斷，正在自動重新連線...";
        });

        client.on('offline', () => {
          netBadge.innerText = "網絡: 離線";
          netBadge.className = "badge warn";
          pttBtn.classList.add('offline');
          statusText.innerText = "網絡已中斷，等待自動恢復...";
          if (isTalking) stopTalking();
        });

        client.on('close', () => {
          netBadge.innerText = "網絡: 斷開";
          netBadge.className = "badge warn";
        });

        client.on('message', (topic, payload) => {
          if (topic !== ROOM_TOPIC || isTalking || payload.byteLength <= 4) return;

          const view = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
          const senderId = view.getUint32(0, true);
          if (senderId === MY_ID) return;

          rxCount++;
          updateDebug();

          pttBtn.classList.add('receiving');
          pttBtn.innerText = "對方講話中...";
          statusText.innerText = `正在接收來自 [${senderId.toString(16).toUpperCase().padStart(8, '0').slice(0, 4)}] 的廣播...`;
          clearTimeout(rxTimeout);
          rxTimeout = setTimeout(() => {
            if (!isTalking) {
              pttBtn.classList.remove('receiving');
              pttBtn.innerText = "按住通話 (PTT)";
              statusText.innerText = "已連線！放開收聽，按住通話";
            }
          }, 300);

          playIncomingUlaw(new Uint8Array(payload.buffer, payload.byteOffset + 4, payload.byteLength - 4));
        });

        client.on('error', (err) => {
          statusText.innerText = "連線錯誤: " + err.message;
        });

      } catch (err) {
        statusText.innerText = "麥克風授權失敗: " + err.name + " - " + err.message;
        initBtn.disabled = false;
      }
    };

    function playIncomingUlaw(ulawBytes) {
      if (!audioCtx) return;
      if (audioCtx.state !== 'running') {
        audioCtx.resume();
      }

      const inLen = ulawBytes.length;
      if (inLen === 0) return;

      const nativeRate = audioCtx.sampleRate;
      const ratio = nativeRate / TARGET_RATE;
      const outLen = Math.floor(inLen * ratio);
      const upsampled = new Float32Array(outLen);

      for (let i = 0; i < outLen; i++) {
        const pos = i / ratio;
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const s0 = (idx === 0) ? lastSample : ULAW_DECODE[ulawBytes[idx - 1]];
        const s1 = ULAW_DECODE[ulawBytes[idx]];
        upsampled[i] = s0 + frac * (s1 - s0);
      }
      lastSample = ULAW_DECODE[ulawBytes[inLen - 1]];

      const fadeLen = Math.min(24, Math.floor(outLen / 10));
      for (let i = 0; i < fadeLen; i++) {
        const w = i / fadeLen;
        upsampled[i] = lastSample * (1 - w) + upsampled[i] * w;
      }

      const audioBuffer = audioCtx.createBuffer(1, outLen, nativeRate);
      audioBuffer.copyToChannel(upsampled, 0);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (nextStartTime < now) {
        nextStartTime = now + 0.04;
      } else if (nextStartTime - now > 0.16) {
        nextStartTime = now + 0.04;
      }

      source.start(nextStartTime);
      nextStartTime += audioBuffer.duration;
    }

    function encodeAudioPacket(float32Buffer, inputRate) {
      const ratio = inputRate / TARGET_RATE;
      const sampleCount = Math.floor(float32Buffer.length / ratio);
      const packet = new Uint8Array(4 + sampleCount);
      const view = new DataView(packet.buffer);
      view.setUint32(0, MY_ID, true);

      for (let i = 0; i < sampleCount; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), float32Buffer.length);
        let sum = 0;
        let count = 0;
        for (let j = start; j < end; j++) {
          sum += float32Buffer[j];
          count++;
        }
        let avg = count > 0 ? (sum / count) : float32Buffer[start];

        if (Math.abs(avg) < 0.004) {
          avg *= 0.2;
        } else {
          avg *= 1.25;
        }

        let clamped = Math.max(-1, Math.min(1, avg));
        let int16 = clamped < 0 ? (clamped * 32768) : (clamped * 32767);
        packet[4 + i] = linearToUlaw(int16 | 0);
      }
      return packet;
    }

    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopTalking(); });

    function startTalking() {
      if (!client || !client.connected || isTalking) return;
      isTalking = true;
      pttBtn.classList.remove('receiving');
      pttBtn.classList.add('active');
      pttBtn.innerText = "正在廣播中...";
      statusText.innerText = "正在向所有在線電話發送高清語音...";

      ensureAudioActive();

      const source = audioCtx.createMediaStreamSource(micStream);
      scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);

      silencer = audioCtx.createGain();
      silencer.gain.value = 0;

      scriptNode.onaudioprocess = (e) => {
        if (!isTalking || !client.connected) return;
        const inputData = e.inputBuffer.getChannelData(0);
        const packet = encodeAudioPacket(inputData, audioCtx.sampleRate);
        client.publish(ROOM_TOPIC, packet, { qos: 0 });

        txCount++;
        updateDebug();
      };

      source.connect(scriptNode);
      scriptNode.connect(silencer);
      silencer.connect(audioCtx.destination);
    }

    function stopTalking() {
      if (!isTalking) return;
      isTalking = false;
      pttBtn.classList.remove('active');
      pttBtn.innerText = "按住通話 (PTT)";
      statusText.innerText = client && client.connected ? "通話結束，放開收聽中" : "網絡重連中...";

      if (scriptNode) {
        scriptNode.disconnect();
        scriptNode = null;
      }
      if (silencer) {
        silencer.disconnect();
        silencer = null;
      }
    }
  </script>
</body>
</html>
