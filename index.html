<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 對講機 - v5.0 零延遲版</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .ver { font-size: 13px; color: #00b0ff; margin-bottom: 8px; font-weight: bold; }
    .status {
      margin-bottom: 20px;
      font-size: 16px;
      color: #ccc;
      padding: 0 20px;
      text-align: center;
    }
    .debug {
      margin-top: 25px;
      font-size: 13px;
      color: #2ecc71;
      font-family: monospace;
      background: #222;
      padding: 8px 14px;
      border-radius: 6px;
    }
    #initBtn {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background: #3498db;
      color: white;
      cursor: pointer;
    }
    #pttBtn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: #e74c3c;
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(231, 76, 60, 0.4);
      display: none;
      touch-action: none;
    }
    #pttBtn:active, #pttBtn.active {
      background: #c0392b;
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="ver">v5.0 雙核 u-law 壓縮 + RingBuffer 零延遲引擎</div>
  <div class="status" id="statusText">請先點擊下方按鈕啟動音訊</div>
  <button id="initBtn">1. 啟用對講機</button>
  <button id="pttBtn">按住通話 (PTT)</button>
  <div class="debug" id="debugText">TX: 0 包 | RX: 0 包 | 延遲緩衝: 0ms</div>

  <script>
    const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
    const TOPIC_ESP32_TX = "ray_walkie_hk/esp32_tx";
    const TOPIC_PHONE_TX = "ray_walkie_hk/phone_tx";
    const TARGET_SAMPLE_RATE = 16000;

    let client = null;
    let audioCtx = null;
    let micStream = null;
    let ioNode = null;
    let isTalking = false;
    let txCount = 0;
    let rxCount = 0;

    // G.711 u-law 快速解碼表 (256 bytes -> Float32 [-1.0, 1.0])
    const ULAW_TABLE = new Float32Array(256);
    (function buildUlawTable() {
      for (let i = 0; i < 256; i++) {
        let u = ~i & 0xFF;
        let sign = (u & 0x80) ? -1 : 1;
        let exponent = (u >> 4) & 0x07;
        let mantissa = u & 0x0F;
        let sample = (((mantissa << 3) + 0x84) << exponent) - 0x84;
        ULAW_TABLE[i] = (sign * sample) / 32768.0;
      }
    })();

    // 環形緩衝區 (以手機原生取樣率 48kHz 儲存)
    const RING_CAPACITY = 32768;
    const ringBuffer = new Float32Array(RING_CAPACITY);
    let writePtr = 0;
    let readPtr = 0;
    let availableSamples = 0;
    let prevSample = 0;
    let jitterReady = false;

    const initBtn = document.getElementById('initBtn');
    const pttBtn = document.getElementById('pttBtn');
    const statusText = document.getElementById('statusText');
    const debugText = document.getElementById('debugText');

    function updateDebug() {
      const ms = audioCtx ? Math.round((availableSamples / audioCtx.sampleRate) * 1000) : 0;
      debugText.innerText = `TX: ${txCount} 包 | RX: ${rxCount} 包 | 延遲緩衝: ${ms}ms`;
    }

    initBtn.onclick = async () => {
      initBtn.disabled = true;
      statusText.innerText = "正在取得麥克風授權...";

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        // 建立單一常駐音訊引擎：同時處理「收音發送」與「RingBuffer 無縫低延遲播放」
        const micSource = audioCtx.createMediaStreamSource(micStream);
        ioNode = audioCtx.createScriptProcessor(2048, 1, 1);

        ioNode.onaudioprocess = (e) => {
          const input = e.inputBuffer.getChannelData(0);
          const output = e.outputBuffer.getChannelData(0);

          if (isTalking) {
            // 講話模式：輸出完全靜音 (防止回授爆音)，並累計發送
            for (let i = 0; i < output.length; i++) output[i] = 0;
            sendMicChunk(input, audioCtx.sampleRate);
          } else {
            // 收聽模式：需要至少 60ms 緩衝才開始播，防止斷續；完成後平滑輸出
            const minStartSamples = Math.floor(audioCtx.sampleRate * 0.06);
            if (!jitterReady && availableSamples >= minStartSamples) {
              jitterReady = true;
            }

            if (jitterReady && availableSamples > 0) {
              for (let i = 0; i < output.length; i++) {
                if (availableSamples > 0) {
                  output[i] = ringBuffer[readPtr];
                  readPtr = (readPtr + 1) % RING_CAPACITY;
                  availableSamples--;
                } else {
                  output[i] = 0;
                  jitterReady = false;
                }
              }
            } else {
              for (let i = 0; i < output.length; i++) output[i] = 0;
            }
          }
        };

        micSource.connect(ioNode);
        ioNode.connect(audioCtx.destination);

        statusText.innerText = `音訊就緒 (${audioCtx.sampleRate}Hz)，正在連 HiveMQ...`;

        client = mqtt.connect(MQTT_BROKER, {
          clientId: "iPhone_HK_" + Math.random().toString(16).substr(2, 8),
          clean: true
        });

        client.on('connect', () => {
          statusText.innerText = "已連線！放開按鈕收聽，按住通話";
          initBtn.style.display = 'none';
          pttBtn.style.display = 'block';
          client.subscribe(TOPIC_ESP32_TX);
        });

        client.on('message', (topic, payload) => {
          if (topic === TOPIC_ESP32_TX && !isTalking) {
            rxCount++;
            pushUlawToRingBuffer(payload);
            updateDebug();
          }
        });

        client.on('error', (err) => {
          statusText.innerText = "MQTT 錯誤: " + err.message;
        });

      } catch (err) {
        statusText.innerText = "授權錯誤: " + err.name + " - " + err.message;
        initBtn.disabled = false;
      }
    };

    // 將收到的 8-bit u-law 封包解碼並插值升頻寫入 RingBuffer
    function pushUlawToRingBuffer(payload) {
      if (!audioCtx) return;
      const inLen = payload.byteLength;
      if (inLen === 0) return;

      const nativeRate = audioCtx.sampleRate;
      const ratio = nativeRate / TARGET_SAMPLE_RATE;
      const outLen = Math.floor(inLen * ratio);

      // 嚴格延遲鎖定：如果緩衝區積壓超過 220ms，立即丟棄舊數據，永遠保持即時通話！
      const maxAllowedSamples = Math.floor(nativeRate * 0.22);
      if (availableSamples + outLen > maxAllowedSamples) {
        const dropCount = (availableSamples + outLen) - Math.floor(nativeRate * 0.08);
        if (dropCount > 0 && dropCount <= availableSamples) {
          readPtr = (readPtr + dropCount) % RING_CAPACITY;
          availableSamples -= dropCount;
        } else {
          readPtr = writePtr;
          availableSamples = 0;
        }
      }

      for (let i = 0; i < outLen; i++) {
        const pos = i / ratio;
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const s0 = (idx === 0) ? prevSample : ULAW_TABLE[payload[idx - 1]];
        const s1 = ULAW_TABLE[payload[idx]];
        const interpolated = s0 + frac * (s1 - s0);

        ringBuffer[writePtr] = interpolated;
        writePtr = (writePtr + 1) % RING_CAPACITY;
      }
      prevSample = ULAW_TABLE[payload[inLen - 1]];
      availableSamples += outLen;
    }

    // 手機發送緩衝：累積 2 次 2048 (即 4096 樣本 ~85ms) 發送一包 16-bit PCM 給 ESP32 (維持原本完美表現)
    let txAccum = new Float32Array(4096);
    let txAccumIdx = 0;

    function sendMicChunk(inputChunk, inputSampleRate) {
      for (let i = 0; i < inputChunk.length; i++) {
        txAccum[txAccumIdx++] = inputChunk[i];
        if (txAccumIdx >= 4096) {
          const pcm16 = downsampleTo16k(txAccum, inputSampleRate);
          const binaryPayload = new Uint8Array(pcm16.buffer, pcm16.byteOffset, pcm16.byteLength);
          client.publish(TOPIC_PHONE_TX, binaryPayload);
          txAccumIdx = 0;
          txCount++;
          updateDebug();
        }
      }
    }

    function downsampleTo16k(float32Buffer, inputSampleRate) {
      const ratio = inputSampleRate / TARGET_SAMPLE_RATE;
      const newLength = Math.floor(float32Buffer.length / ratio);
      const result = new Int16Array(newLength);

      for (let i = 0; i < newLength; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), float32Buffer.length);
        let sum = 0;
        let count = 0;
        for (let j = start; j < end; j++) {
          sum += float32Buffer[j];
          count++;
        }
        let avg = count > 0 ? (sum / count) : float32Buffer[start];
        let s = Math.max(-1, Math.min(1, avg * 1.3));
        result[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return result;
    }

    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopTalking(); });

    function startTalking() {
      if (!client || !client.connected || isTalking) return;
      isTalking = true;
      txAccumIdx = 0;
      // 清空接收緩衝
      readPtr = writePtr;
      availableSamples = 0;
      pttBtn.classList.add('active');
      statusText.innerText = "正在通話中...";
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function stopTalking() {
      if (!isTalking) return;
      isTalking = false;
      pttBtn.classList.remove('active');
      statusText.innerText = "通話結束，靜音待命中";
    }
  </script>
</body>
</html>
