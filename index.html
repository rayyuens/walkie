<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 對講機 - 高清版 v4</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .ver { font-size: 13px; color: #00e676; margin-bottom: 8px; font-weight: bold; }
    .status {
      margin-bottom: 20px;
      font-size: 16px;
      color: #ccc;
      padding: 0 20px;
      text-align: center;
    }
    .debug {
      margin-top: 25px;
      font-size: 13px;
      color: #2ecc71;
      font-family: monospace;
      background: #222;
      padding: 8px 14px;
      border-radius: 6px;
    }
    #initBtn {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background: #3498db;
      color: white;
      cursor: pointer;
    }
    #pttBtn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: #e74c3c;
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(231, 76, 60, 0.4);
      display: none;
      touch-action: none;
    }
    #pttBtn:active, #pttBtn.active {
      background: #c0392b;
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="ver">v4.0 高清插值升頻 + 零延遲版</div>
  <div class="status" id="statusText">請先點擊下方按鈕啟動音訊</div>
  <button id="initBtn">1. 啟用對講機</button>
  <button id="pttBtn">按住通話 (PTT)</button>
  <div class="debug" id="debugText">TX: 0 包 | RX: 0 包</div>

  <script>
    const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
    const TOPIC_ESP32_TX = "ray_walkie_hk/esp32_tx";
    const TOPIC_PHONE_TX = "ray_walkie_hk/phone_tx";
    const TARGET_SAMPLE_RATE = 16000;

    let client = null;
    let audioCtx = null;
    let micStream = null;
    let scriptNode = null;
    let silencer = null;
    let isTalking = false;
    let nextStartTime = 0;
    let lastSample = 0;
    let txCount = 0;
    let rxCount = 0;

    const initBtn = document.getElementById('initBtn');
    const pttBtn = document.getElementById('pttBtn');
    const statusText = document.getElementById('statusText');
    const debugText = document.getElementById('debugText');

    function updateDebug() {
      debugText.innerText = `TX (發送): ${txCount} 包 | RX (接收): ${rxCount} 包`;
    }

    initBtn.onclick = async () => {
      initBtn.disabled = true;
      statusText.innerText = "正在取得麥克風授權...";

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        statusText.innerText = `音訊就緒 (${audioCtx.sampleRate}Hz)，正在連 HiveMQ...`;

        client = mqtt.connect(MQTT_BROKER, {
          clientId: "iPhone_HK_" + Math.random().toString(16).substr(2, 8),
          clean: true
        });

        client.on('connect', () => {
          statusText.innerText = "已連線！放開按鈕收聽，按住通話";
          initBtn.style.display = 'none';
          pttBtn.style.display = 'block';
          client.subscribe(TOPIC_ESP32_TX);
        });

        client.on('message', (topic, payload) => {
          if (topic === TOPIC_ESP32_TX && !isTalking) {
            rxCount++;
            updateDebug();
            playIncomingPCM(payload);
          }
        });

        client.on('error', (err) => {
          statusText.innerText = "MQTT 錯誤: " + err.message;
        });

      } catch (err) {
        statusText.innerText = "授權錯誤: " + err.name + " - " + err.message;
        initBtn.disabled = false;
      }
    };

    // 核心升級：手動將 16kHz 線性插值平滑升頻至手機原生取樣率 (48kHz)，徹底消除 iOS 破音同接縫雜音
    function playIncomingPCM(payload) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const inSamples = Math.floor(payload.byteLength / 2);
      if (inSamples === 0) return;

      const dataView = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
      const raw16k = new Float32Array(inSamples);

      for (let i = 0; i < inSamples; i++) {
        const int16 = dataView.getInt16(i * 2, true);
        raw16k[i] = int16 / 32768.0;
      }

      // 計算手機原生取樣率倍數 (例如 48000 / 16000 = 3 倍)
      const nativeRate = audioCtx.sampleRate;
      const ratio = nativeRate / TARGET_SAMPLE_RATE;
      const outSamples = Math.floor(inSamples * ratio);
      const upsampled = new Float32Array(outSamples);

      // 線性插值平滑升頻 + 封包頭尾無縫銜接
      for (let i = 0; i < outSamples; i++) {
        const pos = i / ratio;
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const s0 = (idx === 0) ? lastSample : raw16k[idx - 1];
        const s1 = raw16k[idx];
        upsampled[i] = s0 + frac * (s1 - s0);
      }
      lastSample = raw16k[inSamples - 1];

      // 直接以手機原生取樣率建立 Buffer，避開 iOS Safari 有 Bug 嘅內置重採樣器
      const audioBuffer = audioCtx.createBuffer(1, outSamples, nativeRate);
      audioBuffer.copyToChannel(upsampled, 0);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      const currentTime = audioCtx.currentTime;
      // 收緊延遲上限至 0.18 秒：一旦有積壓立即貼緊最新時間軸播放
      if (nextStartTime < currentTime) {
        nextStartTime = currentTime + 0.03;
      } else if ((nextStartTime - currentTime) > 0.18) {
        nextStartTime = currentTime + 0.03;
      }

      source.start(nextStartTime);
      nextStartTime += audioBuffer.duration;
    }

    function downsampleTo16k(float32Buffer, inputSampleRate) {
      const ratio = inputSampleRate / TARGET_SAMPLE_RATE;
      const newLength = Math.floor(float32Buffer.length / ratio);
      const result = new Int16Array(newLength);

      for (let i = 0; i < newLength; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), float32Buffer.length);
        let sum = 0;
        let count = 0;
        for (let j = start; j < end; j++) {
          sum += float32Buffer[j];
          count++;
        }
        let avg = count > 0 ? (sum / count) : float32Buffer[start];
        let s = Math.max(-1, Math.min(1, avg * 1.3));
        result[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return result;
    }

    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopTalking(); });

    function startTalking() {
      if (!client || !client.connected || isTalking) return;
      isTalking = true;
      pttBtn.classList.add('active');
      statusText.innerText = "正在通話中...";

      if (audioCtx.state === 'suspended') audioCtx.resume();

      const source = audioCtx.createMediaStreamSource(micStream);
      scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);

      silencer = audioCtx.createGain();
      silencer.gain.value = 0;

      scriptNode.onaudioprocess = (e) => {
        if (!isTalking) return;

        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = downsampleTo16k(inputData, audioCtx.sampleRate);

        const binaryPayload = new Uint8Array(pcm16.buffer, pcm16.byteOffset, pcm16.byteLength);
        client.publish(TOPIC_PHONE_TX, binaryPayload);

        txCount++;
        updateDebug();
      };

      source.connect(scriptNode);
      scriptNode.connect(silencer);
      silencer.connect(audioCtx.destination);
    }

    function stopTalking() {
      if (!isTalking) return;
      isTalking = false;
      pttBtn.classList.remove('active');
      statusText.innerText = "通話結束，靜音待命中";

      if (scriptNode) {
        scriptNode.disconnect();
        scriptNode = null;
      }
      if (silencer) {
        silencer.disconnect();
        silencer = null;
      }
    }
  </script>
</body>
</html>
