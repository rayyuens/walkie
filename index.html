<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 對講機 - iPhone 端</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .status {
      margin-bottom: 30px;
      font-size: 18px;
      color: #aaa;
      padding: 0 20px;
      text-align: center;
      line-height: 1.5;
    }
    #initBtn {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background: #3498db;
      color: white;
      cursor: pointer;
    }
    #pttBtn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: #e74c3c;
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(231, 76, 60, 0.4);
      display: none;
      touch-action: none;
    }
    #pttBtn:active, #pttBtn.active {
      background: #c0392b;
      transform: scale(0.96);
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.6);
    }
  </style>
</head>
<body>

  <div class="status" id="statusText">請先點擊下方按鈕啟動音訊</div>
  <button id="initBtn">1. 啟用對講機 (獲取音訊權限)</button>
  <button id="pttBtn">按住通話 (PTT)</button>

  <script>
    const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt";
    const TOPIC_ESP32_TX = "my_walkie_talkie/esp32_tx"; // 接收 ESP32 傳來的語音
    const TOPIC_PHONE_TX = "my_walkie_talkie/phone_tx"; // 發送給 ESP32 的語音

    let client = null;
    let audioCtx = null;
    let micStream = null;
    let scriptNode = null;
    let silencer = null;
    let isTalking = false;

    const initBtn = document.getElementById('initBtn');
    const pttBtn = document.getElementById('pttBtn');
    const statusText = document.getElementById('statusText');

    initBtn.onclick = async () => {
      initBtn.disabled = true;
      statusText.innerText = "正在取得麥克風授權...";

      try {
        // 1. 純布林值請求，徹底相容 iOS Safari
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        // 2. 解鎖 iOS AudioContext
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        statusText.innerText = "正在連接 MQTT Broker...";

        // 3. 連接 EMQX 公共 Broker (WSS 8084)
        client = mqtt.connect(MQTT_BROKER, {
          clientId: "iPhone_" + Math.random().toString(16).substr(2, 8),
          clean: true
        });

        client.on('connect', () => {
          statusText.innerText = "已連線！放開按鈕收聽，按住通話";
          initBtn.style.display = 'none';
          pttBtn.style.display = 'block';

          client.subscribe(TOPIC_ESP32_TX);
        });

        // 4. 接收並播放 ESP32 傳來的 PCM 音訊
        client.on('message', (topic, payload) => {
          if (topic === TOPIC_ESP32_TX && !isTalking) {
            playIncomingPCM(payload);
          }
        });

        client.on('error', (err) => {
          statusText.innerText = "MQTT 連線失敗: " + err.message;
        });

      } catch (err) {
        statusText.innerText = "授權錯誤: " + err.name + " - " + err.message;
        initBtn.disabled = false;
      }
    };

    function playIncomingPCM(buffer) {
      if (!audioCtx) return;
      const int16Array = new Int16Array(buffer.buffer, buffer.byteOffset, buffer.byteLength / 2);
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      // 建立 16kHz 音訊緩衝區
      const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 16000);
      audioBuffer.copyToChannel(float32Array, 0);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.start();
    }

    // PTT 觸控監聽
    pttBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startTalking();
    });

    pttBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      stopTalking();
    });

    function startTalking() {
      if (!client || !client.connected) {
        statusText.innerText = "MQTT 未連線";
        return;
      }
      isTalking = true;
      pttBtn.classList.add('active');
      statusText.innerText = "正在通話中...";

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const source = audioCtx.createMediaStreamSource(micStream);
      
      // 使用 2048 緩衝大小，發包平穩不塞車
      scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);

      // 靜音隔離節點：防止手機自錄自播產生回授與 Spike 爆音
      silencer = audioCtx.createGain();
      silencer.gain.value = 0;

      scriptNode.onaudioprocess = (e) => {
        if (!isTalking) return;

        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = new Int16Array(inputData.length);

        for (let i = 0; i < inputData.length; i++) {
          let s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        // 以二進制 Uint8Array 送出
        const binaryPayload = new Uint8Array(pcm16.buffer);
        client.publish(TOPIC_PHONE_TX, binaryPayload);
      };

      source.connect(scriptNode);
      scriptNode.connect(silencer);
      silencer.connect(audioCtx.destination);
    }

    function stopTalking() {
      isTalking = false;
      pttBtn.classList.remove('active');
      statusText.innerText = "通話結束，靜音待命中";

      if (scriptNode) {
        scriptNode.disconnect();
        scriptNode = null;
      }
      if (silencer) {
        silencer.disconnect();
        silencer = null;
      }
    }
  </script>
</body>
</html>
