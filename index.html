<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 對講機 - iPhone 端</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .status {
      margin-bottom: 20px;
      font-size: 16px;
      color: #aaa;
      padding: 0 20px;
      text-align: center;
      line-height: 1.5;
    }
    .debug {
      margin-top: 25px;
      font-size: 13px;
      color: #2ecc71;
      font-family: monospace;
    }
    #initBtn {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background: #3498db;
      color: white;
      cursor: pointer;
    }
    #pttBtn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: #e74c3c;
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(231, 76, 60, 0.4);
      display: none;
      touch-action: none;
    }
    #pttBtn:active, #pttBtn.active {
      background: #c0392b;
      transform: scale(0.96);
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.6);
    }
  </style>
</head>
<body>

  <div class="status" id="statusText">請先點擊下方按鈕啟動音訊</div>
  <button id="initBtn">1. 啟用對講機 (獲取音訊權限)</button>
  <button id="pttBtn">按住通話 (PTT)</button>
  <div class="debug" id="debugText">TX: 0 pkts | RX: 0 pkts</div>

  <script>
    const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt";
    const TOPIC_ESP32_TX = "my_walkie_talkie/esp32_tx";
    const TOPIC_PHONE_TX = "my_walkie_talkie/phone_tx";
    const TARGET_SAMPLE_RATE = 16000;

    let client = null;
    let audioCtx = null;
    let micStream = null;
    let scriptNode = null;
    let silencer = null;
    let isTalking = false;
    let nextStartTime = 0;
    let txCount = 0;
    let rxCount = 0;

    const initBtn = document.getElementById('initBtn');
    const pttBtn = document.getElementById('pttBtn');
    const statusText = document.getElementById('statusText');
    const debugText = document.getElementById('debugText');

    function updateDebug() {
      debugText.innerText = `TX (發送): ${txCount} 包 | RX (接收): ${rxCount} 包`;
    }

    initBtn.onclick = async () => {
      initBtn.disabled = true;
      statusText.innerText = "正在取得麥克風授權...";

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        statusText.innerText = `音訊就緒 (${audioCtx.sampleRate}Hz)，正在連 MQTT...`;

        client = mqtt.connect(MQTT_BROKER, {
          clientId: "iPhone_" + Math.random().toString(16).substr(2, 8),
          clean: true
        });

        client.on('connect', () => {
          statusText.innerText = "已連線！放開按鈕收聽，按住通話";
          initBtn.style.display = 'none';
          pttBtn.style.display = 'block';
          client.subscribe(TOPIC_ESP32_TX);
        });

        client.on('message', (topic, payload) => {
          if (topic === TOPIC_ESP32_TX && !isTalking) {
            rxCount++;
            updateDebug();
            playIncomingPCM(payload);
          }
        });

        client.on('error', (err) => {
          statusText.innerText = "MQTT 錯誤: " + err.message;
        });

      } catch (err) {
        statusText.innerText = "授權錯誤: " + err.name + " - " + err.message;
        initBtn.disabled = false;
      }
    };

    // 修復重點 1：用 DataView 安全讀取 Little-Endian 16-bit PCM，並加入時間軸排隊播放
    function playIncomingPCM(payload) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const sampleCount = Math.floor(payload.byteLength / 2);
      if (sampleCount === 0) return;

      const float32Array = new Float32Array(sampleCount);
      const dataView = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);

      for (let i = 0; i < sampleCount; i++) {
        // true 代表 Little-Endian (ESP32 記憶體格式)，徹底解決高低位錯位爆音
        const int16 = dataView.getInt16(i * 2, true);
        float32Array[i] = int16 / 32768.0;
      }

      // 建立 16kHz 音訊 Buffer (瀏覽器會自動平滑升頻至 iPhone 的 48kHz 播放)
      const audioBuffer = audioCtx.createBuffer(1, sampleCount, TARGET_SAMPLE_RATE);
      audioBuffer.copyToChannel(float32Array, 0);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      // Jitter Buffer 排隊機制：防止音訊封包重疊造成劈啪聲
      const currentTime = audioCtx.currentTime;
      if (nextStartTime < currentTime) {
        nextStartTime = currentTime + 0.08; // 預留 80ms 緩衝讓聲音連續
      }
      source.start(nextStartTime);
      nextStartTime += audioBuffer.duration;
    }

    // 修復重點 2：將 iPhone 的 48kHz/44.1kHz 即時降採樣至 16kHz，大幅縮小封包並對齊 ESP32 速度
    function downsampleTo16k(float32Buffer, inputSampleRate) {
      if (inputSampleRate === TARGET_SAMPLE_RATE) {
        const res = new Int16Array(float32Buffer.length);
        for (let i = 0; i < float32Buffer.length; i++) {
          let s = Math.max(-1, Math.min(1, float32Buffer[i]));
          res[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return res;
      }
      const ratio = inputSampleRate / TARGET_SAMPLE_RATE;
      const newLength = Math.round(float32Buffer.length / ratio);
      const result = new Int16Array(newLength);

      for (let i = 0; i < newLength; i++) {
        const idx = Math.min(Math.floor(i * ratio), float32Buffer.length - 1);
        let s = Math.max(-1, Math.min(1, float32Buffer[idx]));
        result[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return result;
    }

    // 同時支援手機觸控與電腦滑鼠測試
    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopTalking(); });

    function startTalking() {
      if (!client || !client.connected || isTalking) return;
      isTalking = true;
      pttBtn.classList.add('active');
      statusText.innerText = "正在通話中...";

      if (audioCtx.state === 'suspended') audioCtx.resume();

      const source = audioCtx.createMediaStreamSource(micStream);
      // 48kHz 下 2048 點約 42ms，降採樣到 16kHz 後只有 ~682 點 (1364 bytes)，非常輕量
      scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);

      silencer = audioCtx.createGain();
      silencer.gain.value = 0;

      scriptNode.onaudioprocess = (e) => {
        if (!isTalking) return;

        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = downsampleTo16k(inputData, audioCtx.sampleRate);

        const binaryPayload = new Uint8Array(pcm16.buffer, pcm16.byteOffset, pcm16.byteLength);
        client.publish(TOPIC_PHONE_TX, binaryPayload);

        txCount++;
        updateDebug();
      };

      source.connect(scriptNode);
      scriptNode.connect(silencer);
      silencer.connect(audioCtx.destination);
    }

    function stopTalking() {
      if (!isTalking) return;
      isTalking = false;
      pttBtn.classList.remove('active');
      statusText.innerText = "通話結束，靜音待命中";

      if (scriptNode) {
        scriptNode.disconnect();
        scriptNode = null;
      }
      if (silencer) {
        silencer.disconnect();
        silencer = null;
      }
    }
  </script>
</body>
</html>
