<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web 對講機 - v15.2 雙向音訊修復版</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0d10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
      padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    .ver {
      font-size: 12px;
      color: #00e676;
      background: rgba(0, 230, 118, 0.12);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: stretch;
      gap: 8px;
      width: 100%;
      max-width: 900px;
      box-sizing: border-box;
      margin-bottom: 8px;
      font-size: 12px;
      padding: 10px;
      background: #14171d;
      border: 1px solid #262b33;
      border-radius: 14px;
    }
    .badge {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 145px;
      min-height: 34px;
      box-sizing: border-box;
      padding: 6px 10px;
      border-radius: 9px;
      background: #1c2026;
      color: #78909c;
      border: 1px solid #2c323b;
      text-align: center;
    }
    .badge.ok {
      color: #00e676;
      border-color: rgba(0, 230, 118, 0.4);
      background: rgba(0, 230, 118, 0.08);
    }
    .badge.warn {
      color: #ffab00;
      border-color: rgba(255, 171, 0, 0.4);
      background: rgba(255, 171, 0, 0.08);
    }
    .badge.off {
      color: #ff5252;
      border-color: rgba(255, 82, 82, 0.4);
      background: rgba(255, 82, 82, 0.08);
    }
    .controls-bar {
      display: none;
      flex-wrap: wrap;
      justify-content: stretch;
      gap: 8px;
      width: 100%;
      max-width: 900px;
      box-sizing: border-box;
      margin-bottom: 8px;
      padding: 10px;
      background: #14171d;
      border: 1px solid #262b33;
      border-radius: 14px;
    }
    select, .ctrl-btn {
      flex: 1 1 175px;
      min-height: 40px;
      background: #1c2026;
      color: #eceff1;
      border: 1px solid #37474f;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .ctrl-btn.active-green {
      border-color: #00e676;
      color: #69f0ae;
      background: rgba(0, 230, 118, 0.12);
    }
    .ctrl-btn.active-cyan {
      border-color: #00e5ff;
      color: #84ffff;
      background: rgba(0, 229, 255, 0.12);
    }
    .status {
      width: 100%;
      max-width: 900px;
      box-sizing: border-box;
      margin-bottom: 8px;
      padding: 12px 16px;
      border: 1px solid #262b33;
      border-radius: 12px;
      background: #14171d;
      font-size: 14px;
      color: #cfd8dc;
      text-align: center;
      line-height: 1.5;
    }
    #initBtn {
      margin-top: 40px;
      padding: 16px 34px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      background: #2979ff;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(41, 121, 255, 0.35);
    }
    #pttBtn {
      width: 185px;
      height: 185px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.15);
      background: #ff1744;
      color: white;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(255, 23, 68, 0.45);
      display: none;
      touch-action: none;
      transition: transform 0.08s ease, background 0.1s ease;
      padding: 0 16px;
      flex-shrink: 0;
    }
    #pttBtn.active {
      background: #d50000;
      transform: scale(0.95);
      box-shadow: 0 4px 15px rgba(255, 23, 68, 0.7);
    }
    #pttBtn.receiving {
      background: #00c853;
      box-shadow: 0 10px 25px rgba(0, 200, 83, 0.45);
    }
    #pttBtn.disabled-mic {
      background: #37474f;
      color: #90a4ae;
      box-shadow: none;
      border-color: #263238;
    }
    #pttBtn.offline {
      background: #546e7a;
      box-shadow: none;
    }
    .chat-box {
      display: none;
      width: 100%;
      max-width: 900px;
      height: 42vh;
      min-height: 240px;
      max-height: 520px;
      height: clamp(240px, 42vh, 520px);
      margin-top: 12px;
      background: #14171d;
      border: 1px solid #262b33;
      border-radius: 14px;
      padding: 14px 16px;
      overflow-y: auto;
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.65;
      box-sizing: border-box;
    }
    .chat-msg {
      margin-bottom: 10px;
      word-break: break-word;
    }
    .chat-msg .time {
      color: #607d8b;
      font-size: 11px;
      margin-right: 4px;
      font-family: monospace;
    }
    .chat-msg .sender {
      font-weight: bold;
      margin-right: 6px;
      font-family: monospace;
    }
    .chat-msg.me .sender { color: #00e5ff; }
    .chat-msg.other .sender { color: #00e676; }
    .chat-msg.interim {
      color: #90a4ae;
      font-style: italic;
    }
    .debug {
      margin-top: 10px;
      font-size: 11px;
      color: #00e676;
      font-family: monospace;
      background: #15181e;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #262b33;
    }
    @media (max-width: 480px) {
      .badges {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .badge {
        min-width: 0;
        flex: initial;
      }
      .chat-box {
        height: 44vh;
        min-height: 260px;
        max-height: 480px;
        height: clamp(260px, 44vh, 480px);
      }
    }
  </style>
</head>
<body>
  <div class="ver">v15.2 雙向音訊修復版 (修復拼寫錯誤 + 完美收發)</div>
  
  <div class="badges">
    <div class="badge" id="wakeBadge">螢幕常亮: 啟動中</div>
    <div class="badge" id="netBadge">網絡: 待命</div>
    <div class="badge" id="micBadge">麥克風: 待命</div>
    <div class="badge" id="sttBadge">粵語字幕: 原生免費</div>
  </div>

  <div class="controls-bar" id="controlsBar">
    <select id="channelSelect">
      <option value="ray_walkie_hk/ch1">CH 1 (公用)</option>
      <option value="ray_walkie_hk/ch2">CH 2 (專用)</option>
      <option value="ray_walkie_hk/ch3">CH 3 (備用)</option>
      <option value="ray_walkie_hk/ch4">CH 4 (測試)</option>
    </select>
    <button class="ctrl-btn" id="toggleMicBtn">鎖定純收聽</button>
    <button class="ctrl-btn active-green" id="toggleSttBtn">原生字幕: 開啟</button>
    <button class="ctrl-btn active-cyan" id="rxSttBtn">代對方聽寫: 開啟</button>
  </div>

  <div class="status" id="statusText">請點擊下方按鈕啟動對講機</div>
  <button id="initBtn">啟用全天候對講機</button>
  <button id="pttBtn">按住通話 (PTT)</button>

  <div class="chat-box" id="chatBox">
    <div class="chat-msg" style="color:#607d8b; text-align:center; font-size:11px;">
      --- 廣東話即時字幕 (100% 原生免費 zh-HK，免 API Key) ---
    </div>
  </div>

  <div class="debug" id="debugText">ID: ---- | TX: 0 | RX: 0 | 咪音量: 0%</div>

  <video id="noSleepVideo" playsinline loop muted style="position:fixed; width:1px; height:1px; opacity:0.01; pointer-events:none;">
    <source src="data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAADFtb292AAAAbG12aGQAAAAA1cA5ANXAOPQAAAPoAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAE10cmFrAAAAXHRraGQAAAAD1cA5ANXAOPQAAAABAAAAAAAAA+gAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAABWRpbmYAAAAUaG1oZAAAAAAAAAAAAAAAJA==" type="video/mp4">
  </video>

  <script>
    const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
    let currentTopic = "ray_walkie_hk/ch1";
    let currentTextTopic = currentTopic + "/text";
    const TARGET_RATE = 16000;

    const MY_ID = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
    const MY_ID_HEX = MY_ID.toString(16).toUpperCase().padStart(8, '0').slice(0, 4);

    let client = null;
    let audioCtx = null;
    let micStream = null;
    let micSource = null;
    let scriptNode = null;
    let silencer = null;
    let listenOnlyMode = false;
    let wakeLock = null;
    let keepAliveTimer = null;
    let isTalking = false;
    let talkSessionId = 0;
    let nextStartTime = 0;
    let lastSample = 0;
    let txCount = 0;
    let rxCount = 0;
    let currentMicLevel = 0;
    let rxTimeout = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let sttEnabled = true;
    let rxAssistStt = true; 
    let sttActiveForSender = null;
    let currentTranscript = "";
    let sttBaseTranscript = "";
    let sttRunFinalResults = [];
    let sttRunInterimResults = [];
    let sttRestartTimer = null;
    let sttRunning = false;
    let sttStartPending = false;
    let sttStopRequested = false;
    let sttStartRetries = 0;
    let sttNeedsFreshRecognition = false;
    let zeroVolumePackets = 0;
    let deviceHasSttConflict = false; 

    const initBtn = document.getElementById('initBtn');
    const pttBtn = document.getElementById('pttBtn');
    const statusText = document.getElementById('statusText');
    const debugText = document.getElementById('debugText');
    const wakeBadge = document.getElementById('wakeBadge');
    const netBadge = document.getElementById('netBadge');
    const micBadge = document.getElementById('micBadge');
    const sttBadge = document.getElementById('sttBadge');
    const controlsBar = document.getElementById('controlsBar');
    const channelSelect = document.getElementById('channelSelect');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const toggleSttBtn = document.getElementById('toggleSttBtn');
    const rxSttBtn = document.getElementById('rxSttBtn');
    const chatBox = document.getElementById('chatBox');
    const noSleepVideo = document.getElementById('noSleepVideo');

    const ULAW_DECODE = new Float32Array(256);
    (function initUlawTable() {
      for (let i = 0; i < 256; i++) {
        let u = ~i & 0xFF;
        let sign = (u & 0x80) ? -1 : 1;
        let exp = (u >> 4) & 0x07;
        let mant = u & 0x0F;
        let sample = (((mant << 3) + 0x84) << exp) - 0x84;
        ULAW_DECODE[i] = (sign * sample) / 32768.0;
      }
    })();

    function linearToUlaw(sample) {
      const BIAS = 0x84;
      const CLIP = 32635;
      let sign = (sample < 0) ? 0x80 : 0;
      if (sample < 0) sample = -sample;
      if (sample > CLIP) sample = CLIP;
      sample += BIAS;

      let exp = 7;
      for (let expMask = 0x4000; (sample & expMask) === 0 && exp > 0; exp--, expMask >>= 1) {}
      let mant = (sample >> (exp + 3)) & 0x0F;
      return (~(sign | (exp << 4) | mant)) & 0xFF;
    }

    function updateDebug() {
      debugText.innerText = `ID: ${MY_ID_HEX} | TX: ${txCount} | RX: ${rxCount} | 咪音量: ${currentMicLevel}%`;
    }
    updateDebug();

    function initNativeRecognition() {
      if (!SpeechRecognition) {
        sttBadge.innerText = "粵語字幕: 瀏覽器不支援";
        sttBadge.className = "badge off";
        toggleSttBtn.style.display = 'none';
        rxSttBtn.style.display = 'none';
        return;
      }
      createNativeRecognition();
    }

    function createNativeRecognition() {
      const instance = new SpeechRecognition();
      recognition = instance;
      sttNeedsFreshRecognition = false;
      instance.lang = 'zh-HK';
      instance.continuous = true;
      instance.interimResults = true;

      instance.onstart = () => {
        if (recognition !== instance) return;
        sttRunning = true;
        sttStartPending = false;
        sttStartRetries = 0;
        sttBadge.innerText = sttActiveForSender === MY_ID_HEX ? "粵語字幕: 本機聽寫中" : `粵語字幕: 代[${sttActiveForSender}]聽寫中`;
        sttBadge.className = "badge ok";
      };

      instance.onresult = (event) => {
        if (recognition !== instance || !sttActiveForSender) return;
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          if (result.isFinal) {
            sttRunFinalResults[i] = result[0].transcript;
            sttRunInterimResults[i] = "";
          } else {
            sttRunInterimResults[i] = result[0].transcript;
          }
        }
        const runFinal = sttRunFinalResults.join("");
        const interim = sttRunInterimResults.join("");
        currentTranscript = `${sttBaseTranscript}${runFinal}${interim}`.trim();
        if (currentTranscript) {
          const targetSender = sttActiveForSender || MY_ID_HEX;
          const isMe = (targetSender === MY_ID_HEX);
          upsertChatMessage(targetSender, currentTranscript, false, isMe);
          publishTextSubtitle(targetSender, currentTranscript, false);
        }
      };

      instance.onerror = (event) => {
        if (recognition !== instance) return;
        if (event.error === "not-allowed" || event.error === "service-not-allowed" || event.error === "audio-capture") {
          sttStopRequested = true;
          sttEnabled = false;
          toggleSttBtn.innerText = "原生字幕: 關閉";
          toggleSttBtn.className = "ctrl-btn";
          sttBadge.innerText = "粵語字幕: 權限或麥克風錯誤";
          sttBadge.className = "badge off";
          statusText.innerText = `語音辨識失敗: ${event.error}`;
        }
      };

      instance.onend = () => {
        if (recognition !== instance) return;
        sttRunning = false;
        sttStartPending = false;
        if (sttActiveForSender && sttEnabled && !sttStopRequested && !(sttActiveForSender === MY_ID_HEX && deviceHasSttConflict)) {
          sttBaseTranscript = currentTranscript;
          sttRunFinalResults = [];
          sttRunInterimResults = [];
          sttNeedsFreshRecognition = true;
          clearTimeout(sttRestartTimer);
          sttRestartTimer = setTimeout(startRecognition, 300);
          return;
        }
        if (sttStopRequested || !sttEnabled || deviceHasSttConflict) commitSttTranscript();
        if (sttEnabled) {
          sttBadge.innerText = deviceHasSttConflict ? "粵語字幕: 由對方代聽寫" : "粵語字幕: 原生就緒";
          sttBadge.className = "badge ok";
        }
      };
    }

    function startRecognition() {
      if (!recognition || !sttActiveForSender || !sttEnabled || sttRunning || sttStartPending || sttStopRequested) return;
      if (sttNeedsFreshRecognition) createNativeRecognition();
      sttStartPending = true;
      try {
        recognition.start();
      } catch (e) {
        sttStartPending = false;
        sttNeedsFreshRecognition = true;
        sttStartRetries++;
        if (sttStartRetries > 8) {
          sttStopRequested = true;
          sttBadge.innerText = "粵語字幕: 啟動失敗";
          sttBadge.className = "badge warn";
          statusText.innerText = "語音辨識無法重新啟動，請重新載入頁面再試";
          commitSttTranscript();
          return;
        }
        clearTimeout(sttRestartTimer);
        sttRestartTimer = setTimeout(startRecognition, Math.min(500 * sttStartRetries, 2000));
      }
    }

    function startSttFor(senderHex) {
      if (!sttEnabled || !recognition) return;
      if (senderHex === MY_ID_HEX && deviceHasSttConflict) return; 
      clearTimeout(sttRestartTimer);
      sttActiveForSender = senderHex;
      currentTranscript = "";
      sttBaseTranscript = "";
      sttRunFinalResults = [];
      sttRunInterimResults = [];
      sttStopRequested = false;
      sttStartRetries = 0;
      startRecognition();
    }

    function commitSttTranscript() {
      if (currentTranscript && sttActiveForSender) {
        const isMe = (sttActiveForSender === MY_ID_HEX);
        upsertChatMessage(sttActiveForSender, currentTranscript, true, isMe);
        publishTextSubtitle(sttActiveForSender, currentTranscript, true);
      }
      currentTranscript = "";
      sttBaseTranscript = "";
      sttRunFinalResults = [];
      sttRunInterimResults = [];
      sttActiveForSender = null;
      sttStopRequested = false;
    }

    function stopSttAndCommit() {
      if (!recognition) return;
      clearTimeout(sttRestartTimer);
      sttStopRequested = true;
      if (sttRunning || sttStartPending) {
        try {
          recognition.stop();
          return;
        } catch (e) {}
      }
      commitSttTranscript();
    }

    toggleSttBtn.onclick = () => {
      sttEnabled = !sttEnabled;
      deviceHasSttConflict = false;
      if (sttEnabled) {
        toggleSttBtn.innerText = "原生字幕: 開啟";
        toggleSttBtn.className = "ctrl-btn active-green";
        sttBadge.innerText = "粵語字幕: 原生就緒";
        sttBadge.className = "badge ok";
      } else {
        stopSttAndCommit();
        toggleSttBtn.innerText = "原生字幕: 關閉";
        toggleSttBtn.className = "ctrl-btn";
        sttBadge.innerText = "粵語字幕: 已關閉";
        sttBadge.className = "badge off";
      }
    };

    rxSttBtn.onclick = () => {
      rxAssistStt = !rxAssistStt;
      if (rxAssistStt) {
        rxSttBtn.innerText = "代對方聽寫: 開啟";
        rxSttBtn.className = "ctrl-btn active-cyan";
      } else {
        rxSttBtn.innerText = "代對方聽寫: 關閉";
        rxSttBtn.className = "ctrl-btn";
      }
    };

    function publishTextSubtitle(senderHex, text, isFinal) {
      if (!client || !client.connected || !text) return;
      const payload = JSON.stringify({ sender: senderHex, transcriber: MY_ID_HEX, text: text, final: isFinal });
      client.publish(currentTextTopic, payload, { qos: 0 });
    }

    function upsertChatMessage(senderHex, text, isFinal, isMe) {
      const interimId = "interim_" + senderHex;
      let msgEl = document.getElementById(interimId);
      const nowStr = new Date().toTimeString().slice(0, 8);
      if (!msgEl) {
        msgEl = document.createElement('div');
        msgEl.id = interimId;
        msgEl.className = `chat-msg ${isMe ? 'me' : 'other'} interim`;
        chatBox.appendChild(msgEl);
      }
      const label = isMe ? `我(${senderHex})` : `對方(${senderHex})`;
      msgEl.innerHTML = `<span class="time">[${nowStr}]</span><span class="sender">${label}:</span><span class="content"></span>`;
      msgEl.querySelector('.content').innerText = text + (isFinal ? "" : " ...");
      if (isFinal) {
        msgEl.removeAttribute('id');
        msgEl.classList.remove('interim');
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeBadge.innerText = "螢幕常亮: 系統鎖定";
          wakeBadge.className = "badge ok";
          return;
        } catch (err) {}
      }
      try {
        noSleepVideo.play().then(() => {
          wakeBadge.innerText = "螢幕常亮: 影片保活";
          wakeBadge.className = "badge ok";
        }).catch(() => {
          wakeBadge.innerText = "螢幕常亮: 手動設永不";
          wakeBadge.className = "badge warn";
        });
      } catch (e) {}
    }

    function playRogerBeep(freq = 1250, durationMs = 65) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + durationMs / 1000);
      } catch (e) {}
    }

    function isStreamHealthy(stream) {
      if (!stream || !stream.active) return false;
      const tracks = stream.getAudioTracks();
      if (tracks.length === 0) return false;
      const t = tracks[0];
      return (t.readyState === 'live' && !t.muted && t.enabled);
    }

    async function getActiveMicStream(forceNew = false) {
      if (!forceNew && isStreamHealthy(micStream)) return micStream;
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
      micBadge.innerText = "麥克風: 活躍中";
      micBadge.className = "badge ok";
      return micStream;
    }

    toggleMicBtn.onclick = async () => {
      await ensureAudioActive();
      listenOnlyMode = !listenOnlyMode;
      if (listenOnlyMode) {
        if (isTalking) stopTalking();
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
        }
        micBadge.innerText = "麥克風: 已關閉";
        micBadge.className = "badge off";
        toggleMicBtn.innerText = "重開麥克風";
        toggleMicBtn.className = "ctrl-btn active-green";
        pttBtn.classList.add('disabled-mic');
        pttBtn.innerText = "純收聽模式\n(已關閉麥克風)";
        statusText.innerText = "已徹底釋放麥克風，目前為省電純收聽模式";
      } else {
        statusText.innerText = "正在重新授權麥克風...";
        try {
          await getActiveMicStream(true);
          toggleMicBtn.innerText = "鎖定純收聽";
          toggleMicBtn.className = "ctrl-btn";
          pttBtn.classList.remove('disabled-mic');
          pttBtn.innerText = "按住通話 (PTT)";
          statusText.innerText = "麥克風已恢復，按住紅掣即可講話";
        } catch (err) {
          statusText.innerText = "重開麥克風失敗: " + err.message;
        }
      }
    };

    channelSelect.onchange = () => {
      const newTopic = channelSelect.value;
      if (client && client.connected && newTopic !== currentTopic) {
        client.unsubscribe(currentTopic);
        client.unsubscribe(currentTextTopic);
        currentTopic = newTopic;
        currentTextTopic = currentTopic + "/text";
        client.subscribe(currentTopic, { qos: 0 });
        client.subscribe(currentTextTopic, { qos: 0 });
        playRogerBeep(1500, 50);
        statusText.innerText = `已切換至 ${channelSelect.options[channelSelect.selectedIndex].text}`;
      }
    };

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && audioCtx) {
        await requestWakeLock();
        await ensureAudioActive();
      }
    });

    async function ensureAudioActive() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
        try { await audioCtx.resume(); } catch (e) {}
      }
    }

    function startAudioKeepAlive() {
      if (keepAliveTimer) clearInterval(keepAliveTimer);
      keepAliveTimer = setInterval(() => {
        if (!audioCtx) return;
        ensureAudioActive();
        if (audioCtx.state === 'running' && !isTalking) {
          const silentBuf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
          const src = audioCtx.createBufferSource();
          src.buffer = silentBuf;
          src.connect(audioCtx.destination);
          src.start();
        }
      }, 20000);
    }

    document.body.addEventListener('touchstart', () => {
      if (audioCtx) ensureAudioActive();
    }, { passive: true });

    initBtn.onclick = async () => {
      initBtn.disabled = true;
      statusText.innerText = "正在請求麥克風權限...";
      try {
        await getActiveMicStream();
        initNativeRecognition();
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await ensureAudioActive();
        startAudioKeepAlive();
        await requestWakeLock();

        statusText.innerText = `音訊就緒 (${audioCtx.sampleRate}Hz)，正在連線 HiveMQ...`;

        client = mqtt.connect(MQTT_BROKER, {
          clientId: "Phone_" + MY_ID_HEX + "_" + Math.random().toString(16).slice(2, 6),
          clean: true,
          keepalive: 25,
          reconnectPeriod: 2000,
          connectTimeout: 10000
        });

        client.on('connect', () => {
          netBadge.innerText = "網絡: 在線";
          netBadge.className = "badge ok";
          pttBtn.classList.remove('offline');
          initBtn.style.display = 'none';
          controlsBar.style.display = 'flex';
          pttBtn.style.display = 'block';
          chatBox.style.display = 'block';
          statusText.innerText = "已連線！按住紅掣講廣東話";
          client.subscribe(currentTopic, { qos: 0 });
          client.subscribe(currentTextTopic, { qos: 0 });
          playRogerBeep(1400, 60);
        });

        client.on('reconnect', () => {
          netBadge.innerText = "網絡: 重連中...";
          netBadge.className = "badge warn";
          pttBtn.classList.add('offline');
        });

        client.on('offline', () => {
          netBadge.innerText = "網絡: 離線";
          netBadge.className = "badge warn";
          pttBtn.classList.add('offline');
          if (isTalking) stopTalking();
        });

        client.on('message', (topic, payload) => {
          if (topic === currentTextTopic) {
            try {
              const data = JSON.parse(new TextDecoder().decode(payload));
              const isOwnEcho = data.sender === MY_ID_HEX && (!data.transcriber || data.transcriber === MY_ID_HEX);
              if (data.sender && data.text && data.transcriber !== MY_ID_HEX && !isOwnEcho) {
                if (sttActiveForSender && sttActiveForSender !== MY_ID_HEX) {
                  try { recognition.stop(); } catch (e) {}
                  sttActiveForSender = null;
                }
                upsertChatMessage(data.sender, data.text, data.final, data.sender === MY_ID_HEX);
              }
            } catch (e) {}
            return;
          }

          if (topic !== currentTopic || isTalking || payload.byteLength <= 4) return;

          const view = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
          const senderId = view.getUint32(0, true);
          if (senderId === MY_ID) return;

          const senderHex = senderId.toString(16).toUpperCase().padStart(8, '0').slice(0, 4);
          rxCount++;
          updateDebug();

          if (sttEnabled && rxAssistStt && !sttActiveForSender && !listenOnlyMode) {
            startSttFor(senderHex);
          }

          pttBtn.classList.add('receiving');
          pttBtn.innerText = "對方講話中...";
          statusText.innerText = `正在接收 [${senderHex}] 的語音...`;
          clearTimeout(rxTimeout);
          rxTimeout = setTimeout(() => {
            if (!isTalking) {
              pttBtn.classList.remove('receiving');
              pttBtn.innerText = !listenOnlyMode ? "按住通話 (PTT)" : "純收聽模式\n(已關閉麥克風)";
              statusText.innerText = !listenOnlyMode ? "已連線！放開收聽，按住通話" : "純收聽模式待命中";
              if (sttActiveForSender && sttActiveForSender !== MY_ID_HEX) {
                stopSttAndCommit();
              }
              playRogerBeep(1150, 70);
            }
          }, 400);

          playIncomingUlaw(new Uint8Array(payload.buffer, payload.byteOffset + 4, payload.byteLength - 4));
        });
      } catch (err) {
        statusText.innerText = "授權錯誤: " + err.message;
        initBtn.disabled = false;
      }
    };

    // 🏆 修正拼寫錯誤，確保接收解碼正常運作
    function playIncomingUlaw(ulawBytes) {
      if (!audioCtx) return;
      if (audioCtx.state !== 'running') audioCtx.resume();

      const inLen = ulawBytes.length;
      if (inLen === 0) return;

      const nativeRate = audioCtx.sampleRate;
      const ratio = nativeRate / TARGET_RATE;
      const outLen = Math.floor(inLen * ratio);
      const upsampled = new Float32Array(outLen);

      for (let i = 0; i < outLen; i++) {
        const pos = i / ratio;
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const s0 = (idx === 0) ? lastSample : ULAW_DECODE[ulawBytes[idx - 1]];
        const s1 = ULAW_DECODE[ulawBytes[idx]];
        upsampled[i] = s0 + frac * (s1 - s0);
      }
      lastSample = ULAW_DECODE[ulawBytes[inLen - 1]];

      const fadeLen = Math.min(24, Math.floor(outLen / 10));
      for (let i = 0; i < fadeLen; i++) {
        const w = i / fadeLen;
        upsampled[i] = lastSample * (1 - w) + upsampled[i] * w;
      }

      const audioBuffer = audioCtx.createBuffer(1, outLen, nativeRate);
      audioBuffer.copyToChannel(upsampled, 0);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (nextStartTime < now || (nextStartTime - now) > 0.16) {
        nextStartTime = now + 0.04;
      }

      source.start(nextStartTime);
      nextStartTime += audioBuffer.duration;
    }

    function encodeAudioPacket(float32Buffer, inputRate) {
      const ratio = inputRate / TARGET_RATE;
      const sampleCount = Math.floor(float32Buffer.length / ratio);
      const packet = new Uint8Array(4 + sampleCount);
      const view = new DataView(packet.buffer);
      view.setUint32(0, MY_ID, true);
      let peak = 0;

      for (let i = 0; i < sampleCount; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), float32Buffer.length);
        let sum = 0;
        let count = 0;
        for (let j = start; j < end; j++) {
          const val = float32Buffer[j];
          sum += val;
          count++;
          const absVal = Math.abs(val);
          if (absVal > peak) peak = absVal;
        }
        let avg = count > 0 ? (sum / count) : float32Buffer[start];

        if (Math.abs(avg) < 0.004) {
          avg *= 0.2;
        } else {
          avg *= 1.25;
        }

        let clamped = Math.max(-1, Math.min(1, avg));
        let int16 = clamped < 0 ? (clamped * 32768) : (clamped * 32767);
        packet[4 + i] = linearToUlaw(int16 | 0);
      }
      currentMicLevel = Math.min(100, Math.round(peak * 180));
      return { packet, peak };
    }

    async function recoverMicFromSttConflict(session) {
      deviceHasSttConflict = true; 
      if (recognition) {
        try { recognition.abort(); } catch (e) {}
      }
      clearTimeout(sttRestartTimer);
      sttRunning = false;
      sttStartPending = false;
      sttActiveForSender = null;
      currentTranscript = "";
      sttBaseTranscript = "";
      sttStopRequested = false;
      sttBadge.innerText = "粵語字幕: 舊機防搶咪保護";
      sttBadge.className = "badge warn";
      if (!isTalking || session !== talkSessionId) return;
      try {
        const freshStream = await getActiveMicStream(true);
        if (!isTalking || session !== talkSessionId) return;
        if (micSource) { try { micSource.disconnect(); } catch (e) {} }
        micSource = audioCtx.createMediaStreamSource(freshStream);
        micSource.connect(scriptNode);
        statusText.innerText = "已自動解除舊機搶咪鎖定，正在發送語音...";
      } catch (e) {}
    }

    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopTalking(); });
    pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startTalking(); });
    pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopTalking(); });

    async function startTalking() {
      if (listenOnlyMode) {
        statusText.innerText = "請先點擊上方「重開麥克風」才可發話！";
        return;
      }
      if (!client || !client.connected || isTalking) return;
      isTalking = true;
      zeroVolumePackets = 0;
      const mySession = ++talkSessionId;
      pttBtn.classList.remove('receiving');
      pttBtn.classList.add('active');
      pttBtn.innerText = "正在廣播中...";
      statusText.innerText = "正在發送語音...";

      try {
        await ensureAudioActive();
        playRogerBeep(1500, 45);

        if (sttEnabled && !deviceHasSttConflict) {
          startSttFor(MY_ID_HEX);
        }

        const activeStream = await getActiveMicStream();
        if (!isTalking || mySession !== talkSessionId) return;

        micSource = audioCtx.createMediaStreamSource(activeStream);
        scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
        silencer = audioCtx.createGain();
        silencer.gain.value = 0;

        scriptNode.onaudioprocess = (e) => {
          if (!isTalking || !client.connected || mySession !== talkSessionId) return;
          const inputData = e.inputBuffer.getChannelData(0);
          const { packet, peak } = encodeAudioPacket(inputData, audioCtx.sampleRate);
          client.publish(currentTopic, packet, { qos: 0 });

          txCount++;
          updateDebug();

          if (sttEnabled && !deviceHasSttConflict && sttActiveForSender === MY_ID_HEX) {
            if (peak < 0.0015) {
              zeroVolumePackets++;
              if (zeroVolumePackets > 18) {
                recoverMicFromSttConflict(mySession);
              }
            } else {
              zeroVolumePackets = 0;
            }
          }
        };

        micSource.connect(scriptNode);
        scriptNode.connect(silencer);
        silencer.connect(audioCtx.destination);
      } catch (err) {
        statusText.innerText = "發話失敗: " + err.message;
        stopTalking();
      }
    }

    function stopTalking() {
      if (!isTalking) return;
      isTalking = false;
      talkSessionId++;
      pttBtn.classList.remove('active');
      pttBtn.innerText = !listenOnlyMode ? "按住通話 (PTT)" : "純收聽模式\n(已關閉麥克風)";
      statusText.innerText = "通話結束，放開收聽中";

      if (micSource) {
        try { micSource.disconnect(); } catch (e) {}
        micSource = null;
      }
      if (scriptNode) {
        try { scriptNode.disconnect(); } catch (e) {}
        scriptNode = null;
      }
      if (silencer) {
        try { silencer.disconnect(); } catch (e) {}
        silencer = null;
      }

      if (sttActiveForSender === MY_ID_HEX) {
        stopSttAndCommit();
      }

      playRogerBeep(1050, 60);
    }
  </script>
